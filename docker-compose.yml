services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Falta MINIO_ROOT_USER en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Falta MINIO_ROOT_PASSWORD en .env}
    volumes:
      - minio_data:/data
    networks:
      - internal

  migrate:
    build:
      context: ./backend
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Falta DATABASE_URL en .env}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Falta DATABASE_URL en .env}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Falta MINIO_ACCESS_KEY en .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Falta MINIO_SECRET_KEY en .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-catalog-images}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost/media}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Falta INTERNAL_API_TOKEN en .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-["*"]}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

  bot:
    build:
      context: ./bot
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Falta BOT_TOKEN en .env}
      BOT_MODE: polling
      API_URL: http://backend:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Falta INTERNAL_API_TOKEN en .env}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
      MINI_APP_URL: ${MINI_APP_URL:-https://example.com}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - minio
    networks:
      - internal

volumes:
  postgres_data:
  minio_data:

networks:
  internal:
    driver: bridge
