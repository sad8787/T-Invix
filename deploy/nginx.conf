upstream frontend_upstream { server frontend:3000; }
upstream backend_upstream { server backend:8000; }
upstream bot_upstream { server bot:8081; }

server {
    listen 80;
    client_max_body_size 12m;

    location /health/ {
        proxy_pass http://backend_upstream/health/;
        proxy_set_header Host $host;
    }
    location /docs {
        proxy_pass http://backend_upstream/docs;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://backend_upstream/openapi.json;
        proxy_set_header Host $host;
    }
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /telegram/webhook {
        proxy_pass http://bot_upstream/telegram/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
    }
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}